[project]
name = "eccv26"
version = "0.1.0"
description = "Qwen3-VL baseline 评测/训练框架（稀疏注意力研究用）"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "accelerate==1.13.0",
    "datasets==4.6.1",
    "hydra-core==1.3.2",
    "omegaconf==2.3.0",
    "openpyxl==3.1.5",
    "pandas==3.0.1",
    "peft==0.18.1",
    "pillow==12.1.1",
    "python-dotenv==1.2.2",
    "qwen-vl-utils==0.0.14",
    "requests==2.32.5",
    "torch==2.10.0",
    "transformers==4.57.3",
]

[tool.ruff]
line-length = 100
target-version = "py311"
