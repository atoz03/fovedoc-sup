# DMR clean-protocol eval reader — STOCK Qwen3-VL-2B-Instruct (no fine-tuning, no DMA/LoRA).
# Used by scripts/run_dmr_oracle_scratchpad_derisk.py --eval-config.
# dma/cross_attn omitted on purpose -> both default to enable=False (verified) = stock model.
model:
  path: Qwen/Qwen3-VL-2B-Instruct
  dtype: bf16
  attn_implementation: null
  device_map: auto
  do_sample: false
  temperature: 0.0
  top_p: 1.0
  repetition_penalty: 1.05
data:
  benchmark_root: data/fovedoc_project
  image_max_pixels: 262144
